[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-release-impact-gate"
version = "2.1.0"
description = "A business-action release gate for comparing Agent builds before rollout."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50,<2", "plotly>=5.24,<8", "pandas>=2.2,<4"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
research = [
  "matplotlib>=3.9,<4",
  "networkx>=3.3,<4",
  "numpy>=2.0,<3",
  "pandas>=2.2,<4",
  "joblib>=1.4,<2",
  "scikit-learn>=1.5,<2",
  "xgboost>=3.4,<4",
]
dev = ["pytest>=8.3,<9", "ruff>=0.7,<1"]
notebook = ["jupyter>=1.1,<2", "nbclient>=0.10,<1", "nbformat>=5.10,<6"]
postgres = ["psycopg[binary]>=3.2,<4"]

[project.scripts]
agent-release-regression = "agent_mesh_risk_lab.regression:main"
agent-release-api = "agent_mesh_risk_lab.api:main"
agent-release-research-run = "agent_mesh_risk_lab.pipeline:main"
agent-release-research-llm-eval = "agent_mesh_risk_lab.real_llm_evaluation:main"
agent-release-research-mechanism-audit = "agent_mesh_risk_lab.mechanism_analysis:main"
agent-release-research-multi-model = "agent_mesh_risk_lab.multi_model_evaluation:main"
agent-release-research-workforce-twin = "agent_mesh_risk_lab.workforce_twin:main"
agent-release-research-deployment-evidence = "agent_mesh_risk_lab.deployment_planner:main"
# Compatibility aliases for existing scripts and research notebooks.
agent-mesh-run = "agent_mesh_risk_lab.pipeline:main"
agent-mesh-llm-eval = "agent_mesh_risk_lab.real_llm_evaluation:main"
agent-mesh-mechanism-audit = "agent_mesh_risk_lab.mechanism_analysis:main"
agent-mesh-api = "agent_mesh_risk_lab.api:main"
agent-mesh-regression = "agent_mesh_risk_lab.regression:main"
agent-mesh-multi-model = "agent_mesh_risk_lab.multi_model_evaluation:main"
agent-mesh-workforce-twin = "agent_mesh_risk_lab.workforce_twin:main"
agent-mesh-deployment-evidence = "agent_mesh_risk_lab.deployment_planner:main"
agent-release-gate = "agent_mesh_risk_lab.release_impact_gate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Setting the shape on a NumPy array has been deprecated.*:DeprecationWarning:joblib.numpy_pickle",
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
]

[tool.ruff]
line-length = 100
target-version = "py312"
