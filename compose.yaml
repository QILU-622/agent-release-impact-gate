services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agent_mesh
      POSTGRES_USER: agent_mesh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_mesh -d agent_mesh"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - agent_mesh_postgres:/var/lib/postgresql/data
    restart: unless-stopped

  gateway:
    build:
      context: .
    environment:
      AGENT_MESH_DATABASE_URL: postgresql://agent_mesh:${POSTGRES_PASSWORD}@postgres:5432/agent_mesh
      AGENT_MESH_SIGNING_SECRET: ${AGENT_MESH_SIGNING_SECRET:?set AGENT_MESH_SIGNING_SECRET in .env}
      AGENT_MESH_PRINCIPALS: /run/secrets/principals.json
      AGENT_MESH_POLICY: /app/configs/enterprise/policy.json
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./configs/enterprise/principals.example.json:/run/secrets/principals.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  agent_mesh_postgres:
